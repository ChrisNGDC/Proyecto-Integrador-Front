<div class="bg-white p-4 border rounded">
    <h3 class="text-lg font-bold">{{ job.company }}</h3>
    <p class="mb-2">{{ job.title }}</p>
    <div class="flex justify-between mt-2 text-sm text-gray-600">
      <p>Modalidad: {{ job.modality }}</p>
      <p>Fecha publicación: {{ job.publicationDate | date: 'dd-MM-yyyy' }}</p>
    </div>
    <button (click)="viewDetails.emit(job.id.toString())"
          class="text-blue-500 hover:underline text-sm mt-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
    Ver más
  </button>
</div>
