<div class="splash-container">
  <div class="header-content">
    <h1>NextStep</h1>
  </div>
  
  <!-- Contenedor principal -->
  <div class="card-container">
    <!-- Contenedor de formularios -->
    <div class="form-container">      
      <!-- Formulario de Login -->
      <div class="login-card" *ngIf="!isRecoveringPassword">   
        <div *ngIf="errorMessage" class="error-message">
          <b>{{ errorMessage }}</b>     
        </div>
        <div *ngIf="successMessage" class="success-message">
          <b>{{ successMessage }}</b>
        </div>     
        <h2 class="login-title">Iniciá Sesión</h2>
        <label for="username">Correo electrónico:</label>
        <input 
          id="username" 
          type="text" 
          [(ngModel)]="username" 
          placeholder="Ingresá tu usuario"
          [disabled]="isLoading"
        />
                
        <div class="password-container">
          <label for="password">Contraseña:</label>
          <div class="input-with-icon">
            <input 
              id="password" 
              [type]="showLoginPassword ? 'text' : 'password'" 
              [(ngModel)]="password" 
              placeholder="Ingresá tu contraseña"
              [disabled]="isLoading"
            />
            <span class="toggle-password" (click)="toggleLoginPasswordVisibility()">
              <i class="fa-solid" [ngClass]="{'fa-eye': !showLoginPassword, 'fa-eye-slash': showLoginPassword}"></i>
            </span>
          </div>
        </div>
        <button (click)="onLogin()" [disabled]="isLoading">
          <span *ngIf="!isLoading">Ingresá ahora</span>
          <span *ngIf="isLoading">Verificando...</span>
        </button>

        <div class="forgot-password-container">
          <span class="forgot-password-link" 
                (click)="isRecoveringPasswordMode()">
            ¿Olvidaste tu contraseña?
          </span>
        </div>     
      </div>

      <!-- Formulario de Recuperación -->
      <div class="login-card" *ngIf="isRecoveringPassword">
        <div *ngIf="errorMessage" class="error-message">
          <b>{{ errorMessage }}</b>     
        </div>
        <div *ngIf="successMessage" class="success-message">
          <b>{{ successMessage }}</b>
        </div>
        <h2 class="recovery-title">Restablecer contraseña</h2>

        <div *ngIf="!codeSent">
          <label for="recovery-email">Correo electrónico:</label>
          <input 
            id="recovery-email" 
            type="text" 
            [(ngModel)]="username" 
            placeholder="Ingresá tu correo"
            [disabled]="isLoading"
          />
      
          <button (click)="onForgotPassword()" [disabled]="isLoading" class="primary-button">
            <span *ngIf="!isLoading">Enviar código</span>
            <span *ngIf="isLoading">Enviando...</span>
          </button>      
        </div>

        <div *ngIf="codeSent">    
          <label for="recovery-code">Código de verificación:</label>
          <input 
            id="recovery-code" 
            type="text" 
            [(ngModel)]="recoveryCode" 
            placeholder="Ingresá el código recibido"
            [disabled]="isLoading"
          />
          <div class="password-container">
            <label for="new-password">Nueva contraseña:</label>
            <div class="input-with-icon">
              <input 
                id="new-password" 
                [type]="showNewPassword  ? 'text' : 'password'" 
                [(ngModel)]="newPassword" 
                placeholder="Ingresá tu nueva contraseña"
                [disabled]="isLoading"
              />
              <span class="toggle-password" (click)="toggleNewPasswordVisibility()">
                <i class="fa-solid" [ngClass]="{'fa-eye': !showNewPassword , 'fa-eye-slash': showNewPassword }"></i>
              </span>
            </div>
          </div> 
          <div class="password-container">
            <label for="confirm-password">Confirmar contraseña:</label>
            <div class="input-with-icon">
              <input 
                id="confirm-password" 
                [type]="showConfirmPassword  ? 'text' : 'password'" 
                [(ngModel)]="confirmPassword" 
                placeholder="Confirmá tu nueva contraseña"
                [disabled]="isLoading"
              />
              <span class="toggle-password" (click)="toggleConfirmPasswordVisibility()">
                <i class="fa-solid" [ngClass]="{'fa-eye': !showConfirmPassword , 'fa-eye-slash': showConfirmPassword }"></i>
              </span>
            </div>
          </div> 
      
          <button (click)="onResetPassword()" [disabled]="isLoading" class="primary-button">
            <span *ngIf="!isLoading">Restablecer contraseña</span>
            <span *ngIf="isLoading">Procesando...</span>
          </button>
        </div>
      
        <div class="forgot-password-container">
          <span class="forgot-password-link" (click)="backToLogin()">
            Volver al inicio de sesión
          </span>
        </div>
       
      </div>
    </div>   
  </div>

  <!-- footer -->
  <div class="hero-text-container">
    <h2 class="hero-title">Bienvenido a la red de tu IFTS</h2>
    <p class="hero-subtitle">Grupo 1 - 2025</p>
  </div>

  <app-spinner *ngIf="isLoading"></app-spinner>
</div>
